<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rollos">
<meta name="mobile-web-app-capable" content="yes">
<title>Conteo Rollos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <!-- CONTEO -->
  <section class="screen active" id="screen-conteo">
    <div class="scroll">
      <div class="header">
        <div class="eyebrow">Conteo</div>
        <h1 id="conteo-title">Citek</h1>
      </div>
      <div class="segmented" id="origin-tabs" role="tablist"></div>
      <div class="grid" id="conteo-grid"></div>
    </div>
  </section>

  <!-- RESUMEN -->
  <section class="screen" id="screen-resumen">
    <div class="scroll">
      <div class="header">
        <div class="eyebrow">Comparación</div>
        <h1 id="resumen-title">&nbsp;</h1>
      </div>
      <div class="hero-card" id="resumen-hero"></div>
      <div class="card list" id="resumen-list"></div>
      <button class="link-action" id="btn-ver-ficha">Ver ficha imprimible</button>
      <button class="link-action" id="btn-cerrar-mes">Cerrar mes y archivar</button>
    </div>
  </section>

  <!-- FICHA (imprimible) -->
  <section class="screen" id="screen-ficha">
    <div class="scroll">
      <div class="header row-between">
        <button class="icon-btn" id="btn-ficha-back" aria-label="Volver">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <button class="pill-btn no-print" id="btn-ficha-print">Imprimir</button>
      </div>
      <div class="header" style="margin-top:4px;">
        <div class="eyebrow">Ficha</div>
        <h1 id="ficha-title">&nbsp;</h1>
      </div>
      <div class="table-scroll">
        <table class="ficha-table" id="ficha-table"></table>
      </div>
      <button class="link-action no-print" id="btn-ficha-reabrir" hidden>Reabrir este mes para editarlo</button>
      <div class="hint no-print">Datos generados por Conteo Rollos.</div>
    </div>
  </section>

  <!-- HISTORIAL -->
  <section class="screen" id="screen-historial">
    <div class="scroll">
      <div class="header">
        <div class="eyebrow">Historial</div>
        <h1>Comparación mensual</h1>
      </div>
      <div class="card list" id="historial-list"></div>
    </div>
  </section>

  <!-- KORE -->
  <section class="screen" id="screen-kore">
    <div class="scroll">
      <div class="header row-between">
        <div>
          <div class="eyebrow" id="kore-eyebrow">Kore</div>
          <h1 id="kore-title">&nbsp;</h1>
        </div>
        <button class="pill-btn" id="btn-kore-toggle">Editar</button>
      </div>
      <div class="card list" id="kore-list"></div>
      <div class="hint" id="kore-hint"></div>
    </div>
  </section>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-screen="conteo" aria-label="Conteo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>
      <span>Conteo</span>
    </button>
    <button class="tab" data-screen="resumen" aria-label="Comparación">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20V11"/><path d="M12 20V5"/><path d="M18 20v-7"/></svg>
      <span>Comparación</span>
    </button>
    <button class="tab" data-screen="historial" aria-label="Historial">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span>Historial</span>
    </button>
    <button class="tab" data-screen="kore" aria-label="Kore">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>
      <span>Kore</span>
    </button>
  </nav>

</div>
<script src="app.js"></script>
</body>
</html>
